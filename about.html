<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHA — About</title>
<meta name="description" content="SHA — bass and dub productions out of Leipzig. Booking info and background.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --fg: #ededed;
    --fg-dim: #8a8a8a;
    --accent: #b0231c;
    --line: #232323;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 40px;
  }

  .mark {
    width: 120px;
    height: auto;
    margin-bottom: 56px;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .live-photo {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
  }

  .bio {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    text-align: center;
    margin: 36px 0 40px;
    max-width: 360px;
  }

  .booking {
    width: 100%;
    text-align: center;
    margin-bottom: 12px;
  }

  .booking-label {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 10px;
  }

  .booking a {
    display: inline-block;
    padding: 13px 28px;
    border: 1px solid var(--fg);
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .booking a:hover,
  .booking a:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--line);
    margin: 48px 0 28px;
  }

  .platforms {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 13px;
    color: var(--fg-dim);
    flex-wrap: wrap;
  }

  .platforms a {
    color: var(--fg-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .platforms a:hover,
  .platforms a:focus-visible {
    color: var(--fg);
    border-color: var(--fg);
  }

  .archive-line {
    margin-top: 40px;
    font-size: 13px;
    text-align: center;
  }

  .archive-line a {
    color: var(--fg);
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    padding-bottom: 1px;
  }

  .archive-line a:hover,
  .archive-line a:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: auto;
    padding-top: 56px;
    font-size: 12px;
    color: #4a4a4a;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  a:focus-visible, .mark:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

  <img class="mark" src="sha-mark-white.png" alt="SHA">

  <main>
    <img class="live-photo" src="sha-live.jpg" alt="SHA performing live">

    <p class="bio">者 SHA .:. bass and dub production out of Leipzig ala BKLYN. Monthly releases. No Spotify 2026. Bandcamp for the fire.</p>

    <div class="booking">
      <div class="booking-label">Booking</div>
      <a href="mailto:shadubspromo@gmail.com">shadubspromo@gmail.com</a>
    </div>

    <div class="divider"></div>

    <div class="platforms">
      <a href="https://www.instagram.com/shadubs____/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://soundcloud.com/shadubs" target="_blank" rel="noopener">SoundCloud</a>
      <a href="https://www.youtube.com/@shadubs/videos" target="_blank" rel="noopener">YouTube</a>
      <a href="https://shadubs.bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
    </div>

    <div class="archive-line">
      <a href="index.html">Back to current release</a>
    </div>
  </main>

  <footer>SHA</footer>

</body>
</html>
