<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHA</title>
<meta name="description" content="SHA — bass music from Leipzig. Underground dubstep and dub productions.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --fg: #ededed;
    --fg-dim: #8a8a8a;
    --accent: #b0231c;
    --line: #232323;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 40px;
  }

  .mark {
    width: 120px;
    height: auto;
    margin-bottom: 56px;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .release-art {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }

  .release-title {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.02em;
    text-align: center;
    margin: 28px 0 4px;
  }

  .release-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--fg-dim);
    text-align: center;
    margin-bottom: 28px;
  }

  .listen-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }

  .listen-links a {
    flex: 1 1 auto;
    text-align: center;
    padding: 13px 20px;
    border: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.01em;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .listen-links a:hover,
  .listen-links a:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .listen-links a.primary {
    border-color: var(--fg);
  }

  .listen-links a.primary:hover,
  .listen-links a.primary:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--line);
    margin: 48px 0 28px;
  }

  .platforms {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 13px;
    color: var(--fg-dim);
    flex-wrap: wrap;
  }

  .platforms a {
    color: var(--fg-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .platforms a:hover,
  .platforms a:focus-visible {
    color: var(--fg);
    border-color: var(--fg);
  }

  .archive-line {
    margin-top: 40px;
    font-size: 13px;
    text-align: center;
  }

  .archive-line a {
    color: var(--fg);
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    padding-bottom: 1px;
  }

  .archive-line a:hover,
  .archive-line a:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: auto;
    padding-top: 56px;
    font-size: 12px;
    color: #4a4a4a;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  a:focus-visible, .mark:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

  <img class="mark" src="sha-mark-white.png" alt="SHA">

  <main>
    <a href="https://shadubs.bandcamp.com/album/plutonium-pullout-dub" target="_blank" rel="noopener">
      <img class="release-art" src="current-release.png" alt="Plutonium Pullout Dub cover art">
    </a>
    <div class="release-title">PLUTONIUM PULLOUT DUB</div>
    <div class="release-label">out now</div>

    <div class="listen-links">
      <a class="primary" href="https://shadubs.bandcamp.com/album/plutonium-pullout-dub" target="_blank" rel="noopener">Bandcamp</a>
      <a href="https://soundcloud.com/shadubs" target="_blank" rel="noopener">SoundCloud</a>
    </div>

    <div class="divider"></div>

    <div class="platforms">
      <a href="about.html">About</a>
      <a href="https://www.instagram.com/shadubs____/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://soundcloud.com/shadubs" target="_blank" rel="noopener">SoundCloud</a>
      <a href="https://www.youtube.com/@shadubs/videos" target="_blank" rel="noopener">YouTube</a>
      <a href="https://shadubs.bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
    </div>

    <div class="archive-line">
      <a href="https://shadubs.bandcamp.com/" target="_blank" rel="noopener">Full discography on Bandcamp</a>
    </div>
  </main>

  <footer>SHA</footer>

</body>
</html>
